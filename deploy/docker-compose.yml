# Regulus Office deployment (docs/SPEC.md §4.2 Packaging, §8).
# Base: office server + Caddy + a filtered Docker API proxy; the office creates one runner container
# per human on the `runners` network. Profiles: media (LiveKit), pg (Postgres), build-only (runner image).
#
#   cp .env.example .env   # then fill BETTER_AUTH_SECRET and OFFICE_MASTER_KEY
#   docker compose up -d --build
#
# With the defaults the office is served at https://localhost by Caddy's internal CA.
# Secrets are never defaulted: Compose refuses to start until the operator sets them.
services:
  office:
    build:
      context: ..
      dockerfile: deploy/office.Dockerfile
    image: ghcr.io/regulus-advanced-systems/regulus-office:${OFFICE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      OFFICE_PORT: "4600"
      OFFICE_HOST: 0.0.0.0
      OFFICE_DATA_DIR: /data
      OFFICE_RUNNER_BACKEND: docker
      # Must equal the origin browsers use, or Origin checks and invite links break.
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-https://${OFFICE_DOMAIN:-localhost}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env (generate with openssl rand -base64 32; see deploy/.env.example)}
      OFFICE_MASTER_KEY: ${OFFICE_MASTER_KEY:?set OFFICE_MASTER_KEY in deploy/.env (generate with openssl rand -base64 32; see deploy/.env.example)}
      # The docker runner backend (SPEC §8, D6) talks to the Engine API through docker-proxy,
      # never to the socket itself: the office runs as the non-root `bun` user and has no socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Runner containers (one per human, SPEC §8) from the build-only `runner-image` service.
      OFFICE_RUNNER_IMAGE: ${OFFICE_RUNNER_IMAGE:-ghcr.io/regulus-advanced-systems/regulus-office-runner:${OFFICE_IMAGE_TAG:-latest}}
      # Runner and HOME-volume names start with the project name, so two Compose projects on
      # one daemon never share runners.
      OFFICE_DOCKER_RUNNER_PREFIX: ${COMPOSE_PROJECT_NAME}
      # Runners join only the `runners` network, where they reach the office (hooks, statusline)
      # but not docker-proxy or Caddy. Adapters write this URL into hook and statusline configs.
      OFFICE_DOCKER_RUNNER_NETWORK: ${COMPOSE_PROJECT_NAME}_runners
      OFFICE_RUNNER_OFFICE_URL: ${OFFICE_RUNNER_OFFICE_URL:-http://office:4600}
      # Trust each Claude Code henchman's own worktree before it starts (#158); false to turn off.
      OFFICE_CLAUDE_TRUST_WORKTREES: ${OFFICE_CLAUDE_TRUST_WORKTREES:-true}
      # Operation dirs live in these named volumes; runners mount `<root>/<operation>` of them with a
      # volume subpath at the same path the office uses (needs Docker Engine 26+).
      OFFICE_DOCKER_VOLUME_MAP: /srv/office/projects=${COMPOSE_PROJECT_NAME}_projects,/srv/office/worktrees=${COMPOSE_PROJECT_NAME}_worktrees
    volumes:
      - office-data:/data
      - projects:/srv/office/projects
      - worktrees:/srv/office/worktrees
    networks:
      default:
      docker-api:
      runners:
        # Host part of OFFICE_RUNNER_OFFICE_URL; the only name runners can resolve here.
        aliases: [office]
    depends_on:
      docker-proxy:
        condition: service_healthy
    expose: ["4600"]

  # Nightly SQLite backups (#203) into a host directory, off the office-data volume, so deleting
  # the volume does not take the backups with it: `sqlite3 .backup` plus an integrity check
  # (scripts/backup.sh) in a sleep loop (scripts/backup-schedule.sh). Same image and user as the
  # office; no network, no Docker socket, no secrets from .env, read-only root filesystem.
  #   docker compose exec backup scripts/backup.sh      back up now
  #   scripts/restore.sh                                list and restore backups (README)
  # The host directory must exist, owned by uid 1000 (the office user) with mode 700;
  # scripts/setup.sh creates it. The data volume is mounted read-write: from a read-only mount
  # sqlite3 reads the WAL without the office.db-shm locks, so an office checkpoint could change
  # pages mid-copy; with the locks, .backup reads one consistent snapshot. Backups only read the
  # database; only scripts/restore-db.sh replaces it, run by hand with the office stopped.
  backup:
    image: ghcr.io/regulus-advanced-systems/regulus-office:${OFFICE_IMAGE_TAG:-latest}
    # Built or pulled with the office service; never pulled on its own (it could differ from a
    # local build).
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    command: ["scripts/backup-schedule.sh"]
    environment:
      OFFICE_DATA_DIR: /data
      OFFICE_BACKUP_DIR: /backups
      OFFICE_BACKUP_TIME: ${OFFICE_BACKUP_TIME:-03:00}
      OFFICE_BACKUP_RETENTION_DAYS: ${OFFICE_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - office-data:/data
      - type: bind
        source: ${OFFICE_BACKUP_HOST_DIR:-./backups}
        target: /backups
        # Fail with "bind source path does not exist" instead of Docker creating it as root.
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on:
      office:
        condition: service_healthy
    healthcheck:
      # Unhealthy once the newest backup is more than 26 hours old (a missed night).
      test: ["CMD", "scripts/backup-schedule.sh", "check"]
      interval: 10m
      timeout: 10s
      start_period: 2m
      start_interval: 2s

  # The only service that mounts the Docker socket. It forwards an allowlist of Engine API
  # calls, enough for the docker runner backend and nothing else, and only to `office`, over
  # an internal network no other service joins. Runners never get the socket or this network
  # (SPEC §8). `:ro` does not make the API read-only; the allowlist below does.
  #
  # Allowed, and why (every other method/path, e.g. /build, /swarm, /secrets, /info, /system,
  # /plugins, /networks/create, /containers/*/archive, /commit, answers 403):
  #   GET/HEAD /_ping, GET /version   API version negotiation by the client.
  #   containers: list, inspect, top  find a human's runner, read its state and processes.
  #               create, start, stop, restart, wait, remove
  #                                   one long-lived runner container per human.
  #   exec: create, start (hijacked stream), resize, inspect
  #                                   tmux sessions and one-off commands run via `docker exec`;
  #                                   resize keeps the PTY in step with the viewer's terminal.
  #   images: inspect, pull           check the runner image is present, pull it if not.
  #   volumes: list, inspect, create, remove
  #                                   one named credential volume per human, mounted at HOME.
  #   networks: list, inspect         read-only; runners join a network, the office never
  #                                   creates or connects networks.
  # Bind mounts in create requests are limited to OFFICE_RUNNER_BIND_ROOT, so the office cannot
  # hand a runner the socket or the host filesystem; named volumes are unaffected. The filter
  # cannot see privileged/host-namespace/device options in a create body, so the proxy narrows
  # what a compromised office can do but is not a sandbox (see README, Deploy notes).
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    # Root (with no capabilities) so it can open the root:docker 0660 socket on any host
    # without knowing the docker group id. Set DOCKER_PROXY_USER=65534:<docker gid> to avoid it.
    user: ${DOCKER_PROXY_USER:-0:0}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    command:
      - -listenip=0.0.0.0
      - -allowfrom=office
      - -allowhealthcheck
      - -watchdoginterval=60
      - -stoponwatchdog
      - -shutdowngracetime=5
      - -allowbindmountfrom=${OFFICE_RUNNER_BIND_ROOT:-/srv/office}
      # `^…$` are implied. Optional /v1.NN prefix; ids, names and volume names are single
      # path segments, so a pattern can never reach a different endpoint.
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version)
      - -allowGET=(/v1\.[0-9]+)?/containers/json
      - -allowGET=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|top)
      - -allowGET=(/v1\.[0-9]+)?/exec/[a-zA-Z0-9]+/json
      - -allowGET=(/v1\.[0-9]+)?/images/[a-zA-Z0-9][a-zA-Z0-9_./:@-]*/json
      - -allowGET=(/v1\.[0-9]+)?/volumes(/[a-zA-Z0-9][a-zA-Z0-9_.-]*)?
      - -allowGET=(/v1\.[0-9]+)?/networks(/[a-zA-Z0-9][a-zA-Z0-9_.-]*)?
      - -allowPOST=(/v1\.[0-9]+)?/containers/create
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart|wait|exec)
      - -allowPOST=(/v1\.[0-9]+)?/exec/[a-zA-Z0-9]+/(start|resize)
      - -allowPOST=(/v1\.[0-9]+)?/images/create
      - -allowPOST=(/v1\.[0-9]+)?/volumes/create
      - -allowDELETE=(/v1\.[0-9]+)?/(containers|volumes)/[a-zA-Z0-9][a-zA-Z0-9_.-]*
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [docker-api]
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Not a service: the office creates runner containers itself. This entry only builds the
  # image: `docker compose --profile build-only build runner-image` (or pull the release tag).
  runner-image:
    build:
      context: ../runner
    image: ${OFFICE_RUNNER_IMAGE:-ghcr.io/regulus-advanced-systems/regulus-office-runner:${OFFICE_IMAGE_TAG:-latest}}
    profiles: ["build-only"]
    command: ["true"]

  # Not a service either: the image for "Hermes, run by the office" (#57, hermes-runner/Dockerfile),
  # the official Hermes Agent image pinned by digest plus the runner uid. Build it with
  # `docker compose --profile build-only build hermes-image`, then set OFFICE_HERMES_IMAGE in
  # deploy/.env to the same name: the office starts one container per managed Hermes agent from it.
  hermes-image:
    build:
      context: ../hermes-runner
    image: ${OFFICE_HERMES_IMAGE:-regulus-office-hermes:0.21.5}
    profiles: ["build-only"]
    command: ["true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      office:
        condition: service_healthy
    ports:
      - "${OFFICE_HTTP_PORT:-80}:80"
      - "${OFFICE_HTTPS_PORT:-443}:443"
      - "${OFFICE_HTTPS_PORT:-443}:443/udp"
    environment:
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Voice and the lounge TV (#48, docs/deploy/media.md). Optional: `docker compose --profile media
  # up -d`, or COMPOSE_PROFILES=media in deploy/.env (`scripts/setup.sh --media` sets it and
  # generates LIVEKIT_API_KEY/SECRET). Browsers signal through Caddy at /livekit on 443; media goes
  # browser <-> LiveKit directly over one UDP port (7882), or TCP 7881 where UDP is blocked. Media
  # never passes through the office, which only mints tokens. The ports are the same on the host
  # and in the container because LiveKit advertises them to browsers.
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    profiles: ["media"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # "<key>: <secret>": the key pair comes from deploy/.env, so livekit.yaml holds no secret.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    configs:
      - source: livekit-yaml
        target: /etc/livekit.yaml
    ports:
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    # Signalling (7880) only on the Compose network, for Caddy.
    expose: ["7880"]
    # Not read_only: Compose writes the generated livekit.yaml into the container.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g

  postgres:
    image: postgres:17
    profiles: ["pg"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - pg-data:/var/lib/postgresql/data

networks:
  default:
  # Office <-> docker-proxy only. Internal: no route out, and no other service joins it.
  docker-api:
    internal: true
  # Office <-> runner containers. Not internal: agents need outbound access to provider APIs and
  # GitHub. Fixed name so OFFICE_DOCKER_RUNNER_NETWORK can point at it. docker-proxy and Caddy
  # are not on it. Stop runners before `docker compose down` (see README, Deploy notes).
  runners:
    name: ${COMPOSE_PROJECT_NAME}_runners

# livekit.yaml, generated by Compose from deploy/.env on every `up` (#48; LiveKit's options:
# https://docs.livekit.io/home/self-hosting/deployment/). No secrets: the key pair is LIVEKIT_KEYS.
configs:
  livekit-yaml:
    content: |
      port: 7880
      log_level: info
      rtc:
        tcp_port: ${LIVEKIT_TCP_PORT:-7881}
        # One UDP port for every participant (LiveKit's UDP mux): one firewall rule.
        udp_port: ${LIVEKIT_UDP_PORT:-7882}
        # The public IP browsers send media to: found with STUN unless LIVEKIT_NODE_IP is set.
        use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        node_ip: "${LIVEKIT_NODE_IP:-}"
      turn:
        # Optional TURN relay for networks that block UDP 7882 (docs/deploy/media.md "TURN").
        enabled: ${LIVEKIT_TURN_ENABLED:-false}
        domain: "${LIVEKIT_TURN_DOMAIN:-${OFFICE_DOMAIN:-localhost}}"
        udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
        # TURN over TLS: 0 is off; needs a certificate for the TURN domain (inside the container).
        tls_port: ${LIVEKIT_TURN_TLS_PORT:-0}
        cert_file: "${LIVEKIT_TURN_CERT_FILE:-}"
        key_file: "${LIVEKIT_TURN_KEY_FILE:-}"
      room:
        empty_timeout: 300
        max_participants: ${LIVEKIT_MAX_PARTICIPANTS:-100}

volumes:
  office-data:
  # Operation checkouts and per-agent worktrees (SPEC §8), shared with runners through group 1001
  # (deploy/office.Dockerfile). Fixed names so OFFICE_DOCKER_VOLUME_MAP can point at them.
  projects:
    name: ${COMPOSE_PROJECT_NAME}_projects
  worktrees:
    name: ${COMPOSE_PROJECT_NAME}_worktrees
  caddy-data:
  caddy-config:
  pg-data:
