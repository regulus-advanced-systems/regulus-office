name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  # Playwright smoke test (SPEC §10 M0): Playwright starts office-server in production mode
  # on a fresh data dir and drives two browsers through register, invite, join, walk, chat, FPV.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:e2e
      - name: Throwaway secrets for this run
        run: |
          for name in BETTER_AUTH_SECRET OFFICE_MASTER_KEY; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One artifact per attempt: a re-run must not replace a failed attempt's evidence (#130).
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # M1 exit criteria, automated half (#120): tests/e2e/agents.e2e.ts starts office-server in
  # production mode with the docker runner backend and a small test runner image holding a fake
  # `claude` (never the real CLI, no account), then spawns a robot, approves its permission
  # request, opens a PR against a fake GitHub, restarts the office and sends the robot home.
  e2e-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:e2e
      - name: Throwaway secrets for this run
        run: |
          for name in BETTER_AUTH_SECRET OFFICE_MASTER_KEY; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      # Same tag and build args the spec uses (tests/e2e/agentOffice.ts); it rebuilds from cache.
      - name: Build the test runner image
        run: |
          docker build -t regulus-office-e2e-runner:local \
            --build-arg RUNNER_UID="$(id -u)" --build-arg RUNNER_GID="$(id -g)" tests/e2e/runner
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:agents
      # The spec itself saves the office-server log, each runner's state, `docker logs`, the fake
      # claude's stderr and tmux panes into test-results/ when a test fails (agentDiagnostics.ts);
      # this adds `docker logs` of any runner container the spec did not get to clean up.
      - name: Runner diagnostics
        if: failure()
        run: |
          out=test-results/ci-runner-diagnostics
          mkdir -p "$out"
          docker ps -a > "$out/docker-ps.txt" 2>&1 || true
          for name in $(docker ps -a --filter name=-runner- --format '{{.Names}}'); do
            docker logs --timestamps "$name" > "$out/$name.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One artifact per attempt: a re-run must not replace a failed attempt's evidence (#130).
          name: playwright-report-agents-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Leftover runners and robot sandboxes
        if: always()
        run: |
          for role in runner sandbox; do
            docker ps -a --filter label=org.regulus.office.role=$role
            docker ps -aq --filter label=org.regulus.office.role=$role | xargs -r docker rm -f
          done

  # `docker compose up` serves the office behind Caddy (SPEC §4.2 Packaging, §13), and the office
  # provisions a runner from the real runner image and runs the fake agent in it (#104).
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: regulus-ci
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Missing secrets fail with a clear message
        run: |
          if docker compose config > /dev/null 2> err.txt; then
            echo "compose accepted a config without secrets" >&2; exit 1
          fi
          cat err.txt
          # Compose reports whichever missing secret it meets first; the order is not stable.
          grep -qE "set (BETTER_AUTH_SECRET|OFFICE_MASTER_KEY) in deploy/.env" err.txt
      - name: deploy/.env with throwaway secrets
        run: |
          auth="$(openssl rand -base64 32)"; key="$(openssl rand -base64 32)"
          echo "::add-mask::$auth"; echo "::add-mask::$key"
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$auth|" \
              -e "s|^OFFICE_MASTER_KEY=.*|OFFICE_MASTER_KEY=$key|" .env.example > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: /healthz through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/healthz; then echo; break; fi
            [ "$i" = 60 ] && exit 1; sleep 2
          done
          curl -fsS -o /dev/null -w "http -> %{http_code} %{redirect_url}\n" http://localhost/healthz || true
          curl -fsSk https://localhost/login | grep -q '<div id="root">'
      - name: Office image runs as a non-root user
        run: test "$(docker compose exec -T office id -u)" != "0"
      # SPEC §8: only docker-proxy mounts the socket; the office reaches a filtered Engine API.
      - name: Docker API only through the filtered proxy
        run: |
          if docker compose exec -T office test -e /var/run/docker.sock; then
            echo "office has the Docker socket" >&2; exit 1
          fi
          docker compose exec -T office bun -e '
            const r = await fetch(process.env.DOCKER_HOST.replace("tcp:", "http:") + "/build", { method: "POST" });
            console.log("POST /build ->", r.status);
            process.exit(r.status === 403 ? 0 : 1);'
          docker compose exec -T -e CHECK_IMAGE=busybox:1.37 office bun run - < docker-proxy-check.ts
      # The runner image is large (Node, the agent CLIs), so it is built with the GHA layer cache
      # rather than `docker compose --profile build-only build runner-image` (same Dockerfile and
      # tag). Only master pushes write the cache; pull requests read it.
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          load: true
          tags: ghcr.io/regulus-advanced-systems/regulus-office-runner:latest
          cache-from: type=gha,scope=runner-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=runner-image' || '' }}
      - name: Runner image works for uid 1001
        run: |
          docker run --rm ghcr.io/regulus-advanced-systems/regulus-office-runner:latest sh -c '
            set -e; id; test "$(id -u):$(id -g)" = 1001:1001
            bun --version; uv --version; node --version; gh --version | head -1; tmux -V; git --version
            curl --version | head -1
            for cli in claude codex gemini kimi opencode; do printf "%s " "$cli"; command -v "$cli"; done'
      # SPEC §8: the office provisions a runner through docker-proxy, mounts a floor from the shared
      # volumes, runs the fake agent in tmux, reaches the office over the runners network and
      # cannot reach docker-proxy or Caddy; then removes everything it created.
      - name: Runner end to end through the office
        run: timeout 300 docker compose exec -T office bun run - < runner-e2e.ts
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Seed owner and invite over HTTPS
        working-directory: .
        run: |
          bun run seed --url https://localhost --email ci-owner@example.com --name "CI Owner" --json \
            | grep -v '"generatedPassword"'
          if bun run seed --url https://localhost --email ci-owner@example.com; then
            echo "seed created a second owner" >&2; exit 1
          fi
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: |
          # Runners are created by the office, not Compose; remove them so the network can go.
          docker ps -aq --filter label=org.regulus.office.prefix=regulus-ci | xargs -r docker rm -f
          docker volume ls -q --filter label=org.regulus.office.prefix=regulus-ci | xargs -r docker volume rm
          docker compose down -v --remove-orphans

  # scripts/setup.sh (#44), the documented install path on an existing VM: shellcheck, then a
  # non-interactive install on this runner (secrets, images, Compose up, /healthz through Caddy,
  # owner seed), a re-run that must keep the secrets, a truncated secret it must refuse, and
  # --upgrade. The runner image is prebuilt from the GHA cache with the runner/ tree label the
  # script checks, so the script sees it as up to date instead of spending ~7 minutes on it.
  setup-script:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: regulus-setup
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/setup.sh scripts/backup.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: runner-tree
        run: echo "tree=$(git rev-parse HEAD:runner)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Prebuild the runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          load: true
          tags: ghcr.io/regulus-advanced-systems/regulus-office-runner:latest
          labels: org.regulus.office.runner-tree=${{ steps.runner-tree.outputs.tree }}
          cache-from: type=gha,scope=runner-image
      - name: Install non-interactively
        run: scripts/setup.sh --domain localhost --non-interactive --owner-email ci-owner@example.com --owner-name "CI Owner"
      - name: Checks after install
        run: |
          test "$(stat -c %a deploy/.env)" = 600
          for name in BETTER_AUTH_SECRET OFFICE_MASTER_KEY; do
            value="$(sed -n "s/^$name=//p" deploy/.env)"
            echo "::add-mask::$value"
            test "${#value}" = 44 && test "$(printf %s "$value" | base64 -d | wc -c)" = 32
          done
          grep -E '^(BETTER_AUTH_SECRET|OFFICE_MASTER_KEY)=' deploy/.env | sha256sum > "$RUNNER_TEMP/secrets.sha"
          curl -fsSk https://localhost/healthz; echo
          curl -fsSk https://localhost/login | grep -q '<div id="root">'
      - name: Re-run keeps the secrets
        run: |
          scripts/setup.sh --non-interactive
          grep -E '^(BETTER_AUTH_SECRET|OFFICE_MASTER_KEY)=' deploy/.env | sha256sum -c "$RUNNER_TEMP/secrets.sha"
      - name: A truncated secret is refused, not replaced
        run: |
          cp deploy/.env "$RUNNER_TEMP/env.bak"
          sed -i -E 's/^(OFFICE_MASTER_KEY=.{30}).*/\1/' deploy/.env
          if scripts/setup.sh --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1; then
            cat "$RUNNER_TEMP/out.txt"; echo "setup accepted a truncated OFFICE_MASTER_KEY" >&2; exit 1
          fi
          grep -q "OFFICE_MASTER_KEY in deploy/.env is 30 characters" "$RUNNER_TEMP/out.txt"
          grep -q '^OFFICE_MASTER_KEY=.\{30\}$' deploy/.env
          cp "$RUNNER_TEMP/env.bak" deploy/.env
      - name: Upgrade
        run: |
          scripts/setup.sh --upgrade --non-interactive
          curl -fsSk https://localhost/healthz; echo
      - name: Compose logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy
        run: |
          docker ps -aq --filter label=org.regulus.office.prefix=regulus-setup | xargs -r docker rm -f
          docker volume ls -q --filter label=org.regulus.office.prefix=regulus-setup | xargs -r docker volume rm
          docker compose down -v --remove-orphans

  # Docker runner backend (#23) against the real daemon: builds a tiny fixture image, then drives
  # a runner through a socket proxy started with the deploy/ allowlist (#95), as the office does
  # in Compose. Bind mounts are allowed from /tmp here (test workdirs) instead of /srv/office.
  docker-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Socket proxy with the deploy/ allowlist
        run: |
          compose=deploy/docker-compose.yml
          img=$(sed -n 's/^    image: \(wollomatic\/socket-proxy.*\)$/\1/p' "$compose")
          mapfile -t allow < <(sed -n 's/^      - -\(allow[A-Z]*=.*\)$/-\1/p' "$compose")
          test -n "$img" && test "${#allow[@]}" -gt 5
          docker run -d --name regulus-ci-proxy --user 0:0 --cap-drop ALL --network host \
            -v /var/run/docker.sock:/var/run/docker.sock:ro "$img" \
            -proxyport=2375 -allowbindmountfrom=/tmp "${allow[@]}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2375/_ping && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:2375/build)" = 403
      # Runner suites, and services discovery + proxy against a real sandbox (#39).
      - run: bun test apps/server/src/runners/docker apps/server/src/services/docker-sandbox.integration.test.ts
        env:
          REGULUS_DOCKER_TESTS: "1"
          REGULUS_DOCKER_RUNNER_HOST: tcp://127.0.0.1:2375
      - name: Proxy log
        if: failure()
        run: docker logs regulus-ci-proxy
      - name: Tear down
        if: always()
        run: docker rm -f regulus-ci-proxy || true

  # linux-user runner backend (SPEC §8): installs the helper and sudoers rules
  # like docs/deploy/linux-user-runner.md, then runs the real integration test
  # (accounts, systemd scopes, tmux) as the unprivileged runner user via sudo -n.
  linux-user:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # nftables: robot sandboxes' NAT (#169).
      - name: Install tmux, acl and nftables
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux acl nftables
      - run: shellcheck apps/server/src/runners/linux-user/helper/office-runner-helper
      - name: Install the helper and sudoers rules
        run: |
          helper=apps/server/src/runners/linux-user/helper
          sudo install -d -m 0755 /usr/local/lib/office /etc/office /srv/office
          sudo install -m 0755 -o root -g root "$helper/office-runner-helper" /usr/local/lib/office/
          echo "OFFICE_SERVER_USER=$USER" | sudo tee /etc/office/runner-helper.conf
          sed "s/^office /$USER /" "$helper/office-runner.sudoers" > "$RUNNER_TEMP/office-runner"
          sudo visudo -cf "$RUNNER_TEMP/office-runner"
          sudo install -m 0440 -o root -g root "$RUNNER_TEMP/office-runner" /etc/sudoers.d/office-runner
          sudo install -d -m 0750 -o "$USER" -g "$USER" /srv/office/projects /srv/office/worktrees
      # The runner user here has blanket sudo, which would hide a missing or too narrow rule:
      # check every call shape the office uses (helper-calls.json) as a user that has only the
      # office-runner rules, e.g. `sandbox-list` with no arguments needs an exact rule (#169).
      - name: Sudoers allow every helper call without blanket sudo
        run: |
          helper=apps/server/src/runners/linux-user/helper
          sudo useradd --no-create-home --shell /usr/sbin/nologin office-sudocheck
          sed "s/^office /office-sudocheck /" "$helper/office-runner.sudoers" > "$RUNNER_TEMP/office-sudocheck"
          sudo visudo -cf "$RUNNER_TEMP/office-sudocheck"
          sudo install -m 0440 -o root -g root "$RUNNER_TEMP/office-sudocheck" /etc/sudoers.d/office-sudocheck
          bash "$helper/check-sudoers.sh" "$helper" office-sudocheck
          sudo rm -f /etc/sudoers.d/office-sudocheck
          sudo userdel office-sudocheck
      # useradd --create-home copies /etc/skel. On GitHub's image that is
      # ~800 MB (.nvm and more) read from a cold disk, so the first copy takes
      # 25-100 s and the second < 1 s (#117). Warm the page cache with a
      # throwaway account so the test measures our code, not the image.
      - name: Pre-warm useradd (/etc/skel copy)
        run: |
          sudo du -sh /etc/skel || true
          start=$(date +%s%N)
          sudo timeout 300 useradd --create-home --shell /bin/bash --comment warmup --user-group office-warmup
          echo "first useradd took $(( ($(date +%s%N) - start) / 1000000 )) ms"
          sudo userdel --remove office-warmup 2>/dev/null || true
      - name: Integration test
        env:
          OFFICE_TEST_LINUX_USER: "1"
        run: >-
          bun test
          apps/server/src/runners/linux-user/linux-user-runner.integration.test.ts
          apps/server/src/runners/linux-user/sandboxes.integration.test.ts
      - name: Leftover accounts, scopes and sandboxes
        if: always()
        run: |
          getent passwd | grep '^office-u-' || true
          systemctl list-units --all --plain --no-legend 'agent-*' 'office-tmux-*' || true
          ip netns list || true
          sudo ls -la /run/office/sandboxes 2>/dev/null || true
