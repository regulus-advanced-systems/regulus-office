name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  # Playwright smoke test (SPEC §10 M0): Playwright starts office-server in production mode
  # on a fresh data dir and drives two browsers through register, invite, join, walk, chat, FPV.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:e2e
      - name: Throwaway secrets for this run
        run: |
          for name in BETTER_AUTH_SECRET OFFICE_MASTER_KEY; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # `docker compose up` serves the office behind Caddy (SPEC §4.2 Packaging, §13).
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: regulus-ci
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Missing secrets fail with a clear message
        run: |
          if docker compose config > /dev/null 2> err.txt; then
            echo "compose accepted a config without secrets" >&2; exit 1
          fi
          cat err.txt
          # Compose reports whichever missing secret it meets first; the order is not stable.
          grep -qE "set (BETTER_AUTH_SECRET|OFFICE_MASTER_KEY) in deploy/.env" err.txt
      - name: deploy/.env with throwaway secrets
        run: |
          auth="$(openssl rand -base64 32)"; key="$(openssl rand -base64 32)"
          echo "::add-mask::$auth"; echo "::add-mask::$key"
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$auth|" \
              -e "s|^OFFICE_MASTER_KEY=.*|OFFICE_MASTER_KEY=$key|" .env.example > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: /healthz through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/healthz; then echo; break; fi
            [ "$i" = 60 ] && exit 1; sleep 2
          done
          curl -fsS -o /dev/null -w "http -> %{http_code} %{redirect_url}\n" http://localhost/healthz || true
          curl -fsSk https://localhost/login | grep -q '<div id="root">'
      - name: Office image runs as a non-root user
        run: test "$(docker compose exec -T office id -u)" != "0"
      # SPEC §8: only docker-proxy mounts the socket; the office reaches a filtered Engine API.
      - name: Docker API only through the filtered proxy
        run: |
          if docker compose exec -T office test -e /var/run/docker.sock; then
            echo "office has the Docker socket" >&2; exit 1
          fi
          docker compose exec -T office bun -e '
            const r = await fetch(process.env.DOCKER_HOST.replace("tcp:", "http:") + "/build", { method: "POST" });
            console.log("POST /build ->", r.status);
            process.exit(r.status === 403 ? 0 : 1);'
          docker compose exec -T -e CHECK_IMAGE=busybox:1.37 office bun run - < docker-proxy-check.ts
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Seed owner and invite over HTTPS
        working-directory: .
        run: |
          bun run seed --url https://localhost --email ci-owner@example.com --name "CI Owner" --json \
            | grep -v '"generatedPassword"'
          if bun run seed --url https://localhost --email ci-owner@example.com; then
            echo "seed created a second owner" >&2; exit 1
          fi
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Docker runner backend (#23) against the real daemon: builds a tiny fixture image, then drives
  # a runner through a socket proxy started with the deploy/ allowlist (#95), as the office does
  # in Compose. Bind mounts are allowed from /tmp here (test workdirs) instead of /srv/office.
  docker-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Socket proxy with the deploy/ allowlist
        run: |
          compose=deploy/docker-compose.yml
          img=$(sed -n 's/^    image: \(wollomatic\/socket-proxy.*\)$/\1/p' "$compose")
          mapfile -t allow < <(sed -n 's/^      - -\(allow[A-Z]*=.*\)$/-\1/p' "$compose")
          test -n "$img" && test "${#allow[@]}" -gt 5
          docker run -d --name regulus-ci-proxy --user 0:0 --cap-drop ALL --network host \
            -v /var/run/docker.sock:/var/run/docker.sock:ro "$img" \
            -proxyport=2375 -allowbindmountfrom=/tmp "${allow[@]}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2375/_ping && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:2375/build)" = 403
      - run: bun test apps/server/src/runners/docker
        env:
          REGULUS_DOCKER_TESTS: "1"
          REGULUS_DOCKER_RUNNER_HOST: tcp://127.0.0.1:2375
      - name: Proxy log
        if: failure()
        run: docker logs regulus-ci-proxy
      - name: Tear down
        if: always()
        run: docker rm -f regulus-ci-proxy || true
